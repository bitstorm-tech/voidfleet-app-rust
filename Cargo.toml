[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Josef Bauer"]
publish = false

[workspace.dependencies]
voidfleet-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.dev]
# Eigener Code unoptimiert: halbiert den Neubau nach großen Änderungen (28 → 16 s), läuft trotzdem flüssig.
opt-level = 0
# Zeilennummern reichen für Backtraces; volle Debuginfo kostet beim Codegen und Linken.
debug = "line-tables-only"
