[package]
name = "voidfleet-server"
description = "Spielserver von Voidfleet: Matches, Zugprüfung, Nachschub und die WebSocket-Verbindung zu den Clients"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "voidfleet-server"
path = "src/main.rs"

[[bin]]
name = "simulate"
path = "src/bin/simulate.rs"

[dependencies]
voidfleet-core.workspace = true
serde.workspace = true
serde_json.workspace = true
rand.workspace = true
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

[dev-dependencies]
tokio-tungstenite = "0.28"

[lints]
workspace = true
