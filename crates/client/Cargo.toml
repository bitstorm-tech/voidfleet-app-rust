[package]
name = "voidfleet-client"
description = "Desktop-Client von Voidfleet (Bevy)"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "voidfleet"
path = "src/main.rs"

[dependencies]
# „3d“ und „ui“ bringen Fenster, Renderer, glTF, PBR-Grundlagen, Bloom, Text, UI und Picking; „jpeg“ die Karten- und
# Porträtbilder (PNG ist dabei). Kein Bevy-Audio: Den Ton macht Kira (Filter, Verzerrung, Kompressor, Panorama, Tonhöhe).
bevy = { version = "0.20.1", default-features = false, features = ["3d", "ui", "jpeg"] }
kira = { version = "0.12.6", default-features = false, features = ["cpal", "mp3"] }
# Nur für das Fenster-Icon (`winit::window::Icon`); dieselbe Version wie in `bevy_winit`.
winit = { version = "0.30", default-features = false }
# Rastert die Mauszeiger (SVG) zur Laufzeit in der Größe des Bildschirms; ohne Text und eingebettete Bilder.
resvg = { version = "0.49", default-features = false }
directories = "6"
voidfleet-core.workspace = true
sys-locale = "0.3"
serde.workspace = true
serde_json.workspace = true
rand.workspace = true

# Nur für das Dock-Icon unter macOS (dort wirkt das Fenster-Icon nicht); dieselben Versionen wie in `arboard`.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSData",
    "NSEnumerator",
    "NSGeometry",
    "objc2-core-foundation",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSBitmapImageRep",
    "NSCell",
    "NSControl",
    "NSCursor",
    "NSDockTile",
    "NSImage",
    "NSImageRep",
    "NSImageView",
    "NSResponder",
    "NSView",
    "NSWindow",
] }
# Nur für das Feature: Die Zeigerbilder gehen als PNG an AppKit (`ui/cursor/macos.rs`); `resvg` bringt tiny-skia
# ohne PNG-Unterstützung mit.
tiny-skia = { version = "0.12", default-features = false, features = ["png-format"] }

[lints]
workspace = true
